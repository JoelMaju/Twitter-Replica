<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Users - Twitter Replica</title>

    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    />

    <style>
      body {
        background-color: #f8f9fa;
      }

      .page-container {
        padding-top: 24px;
        padding-bottom: 40px;
      }

      .page-header {
        margin-bottom: 24px;
      }

      .search-box {
        margin-bottom: 24px;
      }

      .user-card {
        border: 1px solid #e1e4e8;
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 16px;
        background-color: #fff;
      }

      .user-details {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .user-info {
        flex: 1;
        min-width: 0;
      }

      .username {
        display: inline-block;
        margin-bottom: 4px;
        cursor: pointer;
        color: #007bff;
        font-weight: 600;
        text-decoration: none;
        transition: color 0.2s ease;
      }

      .username:hover {
        color: #0056b3;
        text-decoration: underline;
      }

      .user-email {
        margin: 0;
        color: #6c757d;
        font-size: 0.9rem;
        word-break: break-word;
      }

      .btn-follow,
      .btn-unfollow {
        margin-left: auto;
        padding: 6px 14px;
        border: none;
        border-radius: 20px;
        font-size: 14px;
        color: #fff;
      }

      .btn-follow {
        background-color: #007bff;
      }

      .btn-follow:hover {
        background-color: #0069d9;
      }

      .btn-unfollow {
        background-color: #dc3545;
      }

      .btn-unfollow:hover {
        background-color: #c82333;
      }

      .empty-message {
        margin-top: 20px;
      }

      @media (max-width: 576px) {
        .user-details {
          flex-direction: column;
          align-items: flex-start;
        }

        .btn-follow,
        .btn-unfollow {
          margin-left: 0;
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <div class="container page-container">

      <div
        class="d-flex justify-content-between align-items-center page-header"
      >
        <div>
          <h1 class="mb-1">Users</h1>
          <p class="text-muted mb-0">
            Discover and follow other users.
          </p>
        </div>

        <a href="/home" class="btn btn-outline-success">
          Home
        </a>
      </div>

      {% if error %}
      <div class="alert alert-danger">
        {{ error }}
      </div>
      {% endif %}

      <div class="search-box">
        <input
          type="text"
          id="searchInput"
          class="form-control"
          placeholder="Search by username"
          aria-label="Search users"
        />
      </div>

      <div id="usersContainer">

        {% for user in users %}
        <div
          class="user-card"
          data-username="{{ user.username }}"
        >
          <div class="user-details">

            <div class="user-info">
              <h5
                class="username"
                data-user-id="{{ user.id }}"
                tabindex="0"
                role="button"
              >
                @{{ user.username }}
              </h5>

              <p class="user-email">
                {{ user.email }}
              </p>
            </div>

            {% if followers is not none and user.username in followers %}
            <button
              type="button"
              class="btn btn-unfollow"
              data-user-id="{{ user.username }}"
            >
              Unfollow
            </button>
            {% else %}
            <button
              type="button"
              class="btn btn-follow"
              data-user-id="{{ user.username }}"
            >
              Follow
            </button>
            {% endif %}

          </div>
        </div>
        {% endfor %}

      </div>

      <div
        id="emptyMessage"
        class="alert alert-light text-center empty-message"
        style="display: none"
      >
        No users found.
      </div>

    </div>

    <script>
      document.addEventListener(
        "DOMContentLoaded",
        function () {

          const searchInput =
            document.getElementById("searchInput");

          const userCards =
            Array.from(
              document.querySelectorAll(".user-card")
            );

          const emptyMessage =
            document.getElementById("emptyMessage");


          function filterUsers() {
            const searchTerm =
              searchInput.value
                .trim()
                .toLowerCase();

            let visibleUsers = 0;

            userCards.forEach(function (card) {
              const username =
                (
                  card.getAttribute("data-username") ||
                  ""
                ).toLowerCase();

              const matches =
                username.includes(searchTerm);

              card.style.display =
                matches ? "block" : "none";

              if (matches) {
                visibleUsers += 1;
              }
            });

            emptyMessage.style.display =
              visibleUsers === 0
                ? "block"
                : "none";
          }


          async function followUser(button) {
            const username =
              button.getAttribute("data-user-id");

            if (!username) {
              return;
            }

            button.disabled = true;

            try {
              const response = await fetch(
                "/follow",
                {
                  method: "POST",
                  headers: {
                    "Content-Type":
                      "application/json",
                  },
                  body: JSON.stringify({
                    user_id: username,
                  }),
                }
              );

              if (!response.ok) {
                throw new Error(
                  "Unable to follow user"
                );
              }

              window.location.reload();

            } catch (error) {
              button.disabled = false;

              alert(
                "Unable to follow this user. Please try again."
              );
            }
          }


          async function unfollowUser(button) {
            const username =
              button.getAttribute("data-user-id");

            if (!username) {
              return;
            }

            button.disabled = true;

            try {
              const response = await fetch(
                "/unfollow",
                {
                  method: "POST",
                  headers: {
                    "Content-Type":
                      "application/json",
                  },
                  body: JSON.stringify({
                    user_id: username,
                  }),
                }
              );

              if (!response.ok) {
                throw new Error(
                  "Unable to unfollow user"
                );
              }

              window.location.reload();

            } catch (error) {
              button.disabled = false;

              alert(
                "Unable to unfollow this user. Please try again."
              );
            }
          }


          function openUserProfile(element) {
            const userId =
              element.getAttribute("data-user-id");

            if (!userId) {
              return;
            }

            window.location.href =
              `/user/${encodeURIComponent(userId)}`;
          }


          searchInput.addEventListener(
            "input",
            filterUsers
          );


          document
            .querySelectorAll(".btn-follow")
            .forEach(function (button) {
              button.addEventListener(
                "click",
                function () {
                  followUser(button);
                }
              );
            });


          document
            .querySelectorAll(".btn-unfollow")
            .forEach(function (button) {
              button.addEventListener(
                "click",
                function () {
                  unfollowUser(button);
                }
              );
            });


          document
            .querySelectorAll(".username")
            .forEach(function (usernameElement) {

              usernameElement.addEventListener(
                "click",
                function () {
                  openUserProfile(
                    usernameElement
                  );
                }
              );


              usernameElement.addEventListener(
                "keydown",
                function (event) {
                  if (
                    event.key === "Enter" ||
                    event.key === " "
                  ) {
                    event.preventDefault();

                    openUserProfile(
                      usernameElement
                    );
                  }
                }
              );
            });


          filterUsers();
        }
      );
    </script>
  </body>
</html>
