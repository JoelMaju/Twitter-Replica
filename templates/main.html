<!DOCTYPE html>
<html>
  <head>
    <title>Firebase login</title>
    <link
    href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    type="text/css"
    href="{{ url_for('static', path='/styles.css') }}"
    rel="stylesheet"
  />
  <script
    type="module"
    src="{{ url_for('static', path='/firebase-login.js') }}"
  ></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.12.0/jquery-ui.min.js"></script>
    <style>
      body,
      html {
        height: 100%;
        margin: 0;
      }
      .flex-center {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100%;
      }
      .login-box {
        width: 100%;
        max-width: 330px;
      }
    </style>
  </head>

  <body>
    <div class="flex-center">
      <div class="login-box" >
        <h2>Implementation of Twitter</h2>
        <h2>User Login</h2>
        <input
          type="email"
          class="form-control"
          name="email"
          id="email"
          placeholder="Email Address"
          style="margin-top: 15px"
        /><br />
        <input
          type="password"
          class="form-control"
          name="password"
          id="password"
          placeholder="Password"
        /><br />
        <button id="login" class="btn btn-secondary">Login</button>
        <button id="sign-up" class="btn btn-dark">Sign Up</button><br>
      </div>
    </div>
    <div id="sign-out"></div>
  </body>
</html>
