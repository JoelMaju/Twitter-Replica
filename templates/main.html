<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Login | Twitter Replica</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', path='/styles.css') }}"
    />

    <script
      type="module"
      src="{{ url_for('static', path='/firebase-login.js') }}"
    ></script>

    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
        background-color: #f8f9fa;
      }

      .login-page {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .login-card {
        width: 100%;
        max-width: 420px;
        padding: 32px;
        background-color: #ffffff;
        border: 1px solid #e1e4e8;
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      }

      .app-title {
        margin-bottom: 4px;
        font-size: 1.75rem;
        font-weight: 700;
        text-align: center;
      }

      .login-subtitle {
        margin-bottom: 28px;
        color: #6c757d;
        text-align: center;
      }

      .form-control {
        min-height: 46px;
      }

      .auth-buttons {
        display: flex;
        gap: 10px;
        margin-top: 24px;
      }

      .auth-buttons .btn {
        flex: 1;
      }

      .login-footer {
        margin-top: 24px;
        color: #6c757d;
        font-size: 0.85rem;
        text-align: center;
      }

      @media (max-width: 480px) {
        .login-card {
          padding: 24px;
        }

        .auth-buttons {
          flex-direction: column;
        }
      }
    </style>
  </head>

  <body>
    <main class="login-page">
      <section class="login-card">
        <h1 class="app-title">
          Twitter Replica
        </h1>

        <p class="login-subtitle">
          Sign in to your account or create a new one.
        </p>

        <div class="mb-3">
          <label
            for="email"
            class="form-label"
          >
            Email address
          </label>

          <input
            type="email"
            class="form-control"
            id="email"
            name="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          />
        </div>

        <div class="mb-3">
          <label
            for="password"
            class="form-label"
          >
            Password
          </label>

          <input
            type="password"
            class="form-control"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />
        </div>

        <div class="auth-buttons">
          <button
            id="login"
            type="button"
            class="btn btn-primary"
          >
            Log In
          </button>

          <button
            id="sign-up"
            type="button"
            class="btn btn-outline-primary"
          >
            Sign Up
          </button>
        </div>

        <p class="login-footer">
          Portfolio project built with FastAPI,
          Firebase Authentication and Cloud Firestore.
        </p>
      </section>
    </main>
  </body>
</html>
