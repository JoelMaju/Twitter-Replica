<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>User Profile - Twitter Replica</title>

    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    />

    <style>
      body {
        background-color: #f8f9fa;
      }

      .page-container {
        padding-top: 24px;
        padding-bottom: 40px;
      }

      .profile-card {
        background-color: #fff;
        border: 1px solid #e1e4e8;
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 24px;
      }

      .profile-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
      }

      .profile-info h1 {
        margin-bottom: 8px;
      }

      .profile-email {
        margin: 0;
        color: #6c757d;
      }

      .btn-follow,
      .btn-unfollow {
        padding: 6px 14px;
        border: none;
        border-radius: 20px;
        font-size: 14px;
        color: #fff;
      }

      .btn-follow {
        background-color: #007bff;
      }

      .btn-follow:hover {
        background-color: #0069d9;
      }

      .btn-unfollow {
        background-color: #dc3545;
      }

      .btn-unfollow:hover {
        background-color: #c82333;
      }

      .tweet-card {
        max-width: 600px;
        margin: 20px auto;
      }

      .tweet-image {
        width: 100%;
        height: auto;
        object-fit: contain;
      }

      .tweet-username {
        font-weight: 600;
        margin-bottom: 4px;
      }

      .tweet-meta {
        font-size: 0.9rem;
        color: #6c757d;
        margin-bottom: 8px;
      }

      @media (max-width: 576px) {
        .profile-header {
          flex-direction: column;
          align-items: flex-start;
        }

        .btn-follow,
        .btn-unfollow {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <div class="container page-container">

      <div class="mb-3">
        <a href="/home" class="btn btn-outline-success">
          Home
        </a>
      </div>

      <div class="profile-card">
        <div class="profile-header">

          <div class="profile-info">
            <h1>@{{ userData.username }}</h1>

            <p class="profile-email">
              {{ userData.email }}
            </p>
          </div>

          {% if followers is not none and userData.username in followers %}
          <button
            type="button"
            class="btn btn-unfollow"
            data-user-id="{{ userData.username }}"
          >
            Unfollow
          </button>
          {% else %}
          <button
            type="button"
            class="btn btn-follow"
            data-user-id="{{ userData.username }}"
          >
            Follow
          </button>
          {% endif %}

        </div>
      </div>

      <div class="row mb-4">
        <div class="col-md-12">
          <input
            type="text"
            class="form-control"
            id="searchInput"
            placeholder="Search this user's tweets"
            aria-label="Search tweets"
          />
        </div>
      </div>

      <div class="mt-4">
        <h2>Tweets</h2>

        <div id="tweetContainer"></div>

        <div
          id="emptyMessage"
          class="alert alert-light text-center"
          style="display: none"
        >
          No tweets found.
        </div>
      </div>

    </div>

    <script>
      document.addEventListener(
        "DOMContentLoaded",
        function () {

          const tweets = {{ tweetList | safe }};

          const tweetContainer =
            document.getElementById("tweetContainer");

          const searchInput =
            document.getElementById("searchInput");

          const emptyMessage =
            document.getElementById("emptyMessage");

          const originalTweets = [...tweets];


          function formatDate(dateString) {
            if (!dateString) {
              return "";
            }

            const date = new Date(dateString);

            if (Number.isNaN(date.getTime())) {
              return dateString;
            }

            return date.toLocaleString();
          }


          function renderTweets(tweetList) {
            tweetContainer.innerHTML = "";

            if (tweetList.length === 0) {
              emptyMessage.style.display = "block";
              return;
            }

            emptyMessage.style.display = "none";


            tweetList.forEach(function (tweet) {
              const card =
                document.createElement("div");

              card.className =
                "card tweet-card";


              const cardBody =
                document.createElement("div");

              cardBody.className =
                "card-body";


              const username =
                document.createElement("div");

              username.className =
                "tweet-username";

              username.textContent =
                `@${tweet.username}`;


              const date =
                document.createElement("div");

              date.className =
                "tweet-meta";

              date.textContent =
                formatDate(tweet.date);


              const content =
                document.createElement("p");

              content.className =
                "card-text";

              content.textContent =
                tweet.content;


              cardBody.appendChild(username);
              cardBody.appendChild(date);
              cardBody.appendChild(content);


              if (tweet.image_url) {
                const image =
                  document.createElement("img");

                image.className =
                  "card-img-top tweet-image";

                image.src =
                  tweet.image_url;

                image.alt =
                  `Image posted by ${tweet.username}`;

                card.appendChild(image);
              }


              card.appendChild(cardBody);

              tweetContainer.appendChild(card);
            });
          }


          function filterTweets() {
            const searchTerm =
              searchInput.value
                .trim()
                .toLowerCase();

            const filteredTweets =
              originalTweets.filter(
                function (tweet) {
                  const username =
                    (tweet.username || "")
                      .toLowerCase();

                  const content =
                    (tweet.content || "")
                      .toLowerCase();

                  return (
                    username.includes(searchTerm) ||
                    content.includes(searchTerm)
                  );
                }
              );

            renderTweets(filteredTweets);
          }


          async function followUser(button) {
            const username =
              button.getAttribute("data-user-id");

            if (!username) {
              return;
            }

            button.disabled = true;

            try {
              const response =
                await fetch(
                  "/follow",
                  {
                    method: "POST",
                    headers: {
                      "Content-Type":
                        "application/json",
                    },
                    body: JSON.stringify({
                      user_id: username,
                    }),
                  }
                );

              if (!response.ok) {
                throw new Error(
                  "Unable to follow user"
                );
              }

              window.location.reload();

            } catch (error) {
              button.disabled = false;

              alert(
                "Unable to follow this user. Please try again."
              );
            }
          }


          async function unfollowUser(button) {
            const username =
              button.getAttribute("data-user-id");

            if (!username) {
              return;
            }

            button.disabled = true;

            try {
              const response =
                await fetch(
                  "/unfollow",
                  {
                    method: "POST",
                    headers: {
                      "Content-Type":
                        "application/json",
                    },
                    body: JSON.stringify({
                      user_id: username,
                    }),
                  }
                );

              if (!response.ok) {
                throw new Error(
                  "Unable to unfollow user"
                );
              }

              window.location.reload();

            } catch (error) {
              button.disabled = false;

              alert(
                "Unable to unfollow this user. Please try again."
              );
            }
          }


          searchInput.addEventListener(
            "input",
            filterTweets
          );


          document
            .querySelectorAll(".btn-follow")
            .forEach(function (button) {
              button.addEventListener(
                "click",
                function () {
                  followUser(button);
                }
              );
            });


          document
            .querySelectorAll(".btn-unfollow")
            .forEach(function (button) {
              button.addEventListener(
                "click",
                function () {
                  unfollowUser(button);
                }
              );
            });


          renderTweets(tweets);
        }
      );
    </script>
  </body>
</html>
